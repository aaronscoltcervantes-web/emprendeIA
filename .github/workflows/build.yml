name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf automake libtool libtool-bin \
          libltdl-dev pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake \
          libffi-dev libssl-dev build-essential ccache

    - name: Cache de Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: buildozer-v2-${{ hashFiles('buildozer.spec') }}

    - name: Instalar Buildozer
      run: |
        python -m pip install --upgrade pip
        pip install buildozer "cython<3" virtualenv

    - name: Compilar APK
      run: |
        set -o pipefail
        buildozer -v android debug 2>&1 | tee build.log

    - name: Subir log si falla
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    - name: Subir APK
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: bin/*.apk
